[pytest]
# Pytest configuration for ml2plc project

minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers for test selection
markers =
    fast: fast structural validation tests (compile + validate structure only)
    slow: slow functional validation tests (compile + validate accuracy with trained models)
    e2e: end-to-end compilation tests
    quality: code quality and structural validation tests
    unit: unit tests for individual components

# Default test options
addopts =
    -v
    --tb=short
    -ra
    --strict-markers

# Output options
console_output_style = progress
